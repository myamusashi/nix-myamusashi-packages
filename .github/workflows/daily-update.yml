name: Daily Package Update

on:
  schedule:
    # 02:00 UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-packages:
    name: Update, Build, and Push
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://myamusashi.cachix.org https://cache.nixos.org https://nix-community.cachix.org https://chaotic-nyx.cachix.org https://ezkea.cachix.org https://hyprland.cachix.org https://walker.cachix.org https://walker-git.cachix.org https://cache.flox.dev https://cache.xinux.uz https://attic.xuyh0120.win/lantian
            extra-trusted-public-keys = myamusashi.cachix.org-1:ra4PbY6yqM1pSvkGqJ78CZse3WWgjk4rOXBMtjD9YrY= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= chaotic-nyx.cachix.org-1:HfnXSw4pj95iI/n17rIDy40agHj12WfF+Gqk6SonIT8= ezkea.cachix.org-1:ioBmUbJTZIKsHmWWXPe1FSFbeVe+afhfgqgTSNd34eI= flox-cache-public-1:7F4OyH7ZCnFhcze3fJdfyXYLQw/aV7GEed86nQ7IsOs= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc= walker.cachix.org-1:fG8q+uAaMqhsMxWjwvk0IMb4mFPFLqHjuvfwQxE4oJM= walker-git.cachix.org-1:vmC0ocfPWh0S/vRAQGtChuiZBTAeZwiKDeyyXM0/7pM= cache.xinux.uz:BXCrtqejFjWzWEB9YuGB7X2MV4ttBur1N8BkwQRdH+0= lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=

      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: myamusashi
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install nushell
        run: nix profile install nixpkgs#nushell

      - name: Update local packages
        id: update
        run: |
          nu ./update-packages.nu
      
          if [ -z "$(git status --porcelain packages/ flake.lock)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
      
          echo "changed=true" >> "$GITHUB_OUTPUT"
          changed_pkgs=$(git status --porcelain packages/ \
            | awk '{print $2}' \
            | sed -E 's|^packages/([^/.]+).*|\1|' \
            | sort -u | tr '\n' ' ' | sed 's/ $//')
          echo "packages=$changed_pkgs" >> "$GITHUB_OUTPUT"

      - name: Build updated packages
        if: steps.update.outputs.changed == 'true'
        env:
          NIXPKGS_ALLOW_UNFREE: 1
          CARGO_BUILD_JOBS: 2
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_RELEASE_DEBUG: 0
        run: |
          changed="${{ steps.update.outputs.packages }}"
          if [ -n "$changed" ]; then
            for pkg in $changed; do
              echo "Building $pkg..."
              nix build --impure ".#$pkg" --no-link --print-out-paths --experimental-features "nix-command flakes ca-derivations"
            done
          else
            echo "No specific packages to build"
          fi

      - name: Commit and push updates
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock packages/
          git commit -m "chore: daily package updates"
          git push
